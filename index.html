<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KURS // CONVERTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="ticker-bar">
      <div class="ticker-track" id="ticker">Loading rates...</div>
    </div>

    <main>
      <div class="card">
        <div class="card-header">
          <span class="logo">💱</span>
          <h1>KURS <span class="accent">// CONVERTER</span></h1>
          <p class="tagline">REAL-TIME EXCHANGE RATE</p>
        </div>

        <div class="form">
          <div class="input-group">
            <label>AMOUNT</label>
            <input type="number" id="amount" placeholder="0.00" value="100000" min="0" />
          </div>

          <div class="pair-row">
            <div class="input-group">
              <label>FROM</label>
              <select id="from"></select>
            </div>

            <button class="swap-btn" id="swapBtn" title="Swap">⇄</button>

            <div class="input-group">
              <label>TO</label>
              <select id="to"></select>
            </div>
          </div>

          <button class="convert-btn" id="convertBtn">CONVERT</button>
        </div>

        <div class="result" id="result" hidden>
          <div class="result-label">RESULT</div>
          <div class="result-value" id="resultValue">—</div>
          <div class="result-rate" id="resultRate"></div>
          <div class="result-time" id="resultTime"></div>
        </div>
      </div>

      <footer>
        <span>POWERED BY EXCHANGERATE-API</span>
        <span id="statusDot" class="dot dot--green"></span>
        <span id="statusText">LIVE</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
