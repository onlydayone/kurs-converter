<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="description" content="Real-time currency converter with crypto CEX vibes" />
    <title>KURS // CONVERTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>" />
  </head>
  <body>
    <div class="ticker-bar">
      <div class="ticker-track" id="ticker">Loading rates...</div>
    </div>

    <main>
      <div class="card">
        <div class="card-header">
          <div class="logo-row">
            <span class="logo">💱</span>
            <div>
              <h1>KURS <span class="accent">// CONVERTER</span></h1>
              <p class="tagline">REAL-TIME EXCHANGE RATE</p>
            </div>
          </div>
        </div>

        <div class="form">
          <div class="input-group">
            <label>AMOUNT</label>
            <input type="number" id="amount" placeholder="0.00" value="100000" min="0" inputmode="decimal" />
            <span class="amount-display" id="amountDisplay"></span>
          </div>

          <div class="preset-row">
            <button class="preset-btn" data-val="10000">10K</button>
            <button class="preset-btn" data-val="100000">100K</button>
            <button class="preset-btn" data-val="1000000">1M</button>
            <button class="preset-btn" data-val="10000000">10M</button>
            <button class="preset-btn" data-val="100000000">100M</button>
          </div>

          <div class="pair-row">
            <div class="input-group">
              <label>FROM</label>
              <select id="from"></select>
            </div>
            <button class="swap-btn" id="swapBtn" title="Swap currencies">⇄</button>
            <div class="input-group">
              <label>TO</label>
              <select id="to"></select>
            </div>
          </div>

          <button class="convert-btn" id="convertBtn">CONVERT</button>
        </div>

        <div class="result" id="result" hidden>
          <div class="result-label">RESULT</div>
          <div class="result-from" id="resultFrom"></div>
          <div class="result-value" id="resultValue">—</div>
          <div class="result-rate" id="resultRate"></div>
          <div class="result-time" id="resultTime"></div>
          <div class="result-actions">
            <button class="action-btn" id="copyBtn">⧉ COPY</button>
            <button class="action-btn" id="shareBtn">↗ SHARE</button>
            <button class="action-btn" id="favBtn">☆ FAV</button>
            <button class="action-btn" id="multiBtn">◈ MULTI</button>
          </div>
        </div>

        <div class="multi-view" id="multiView" hidden>
          <div class="multi-label">ALL RATES</div>
          <div class="multi-scroll">
            <table class="multi-table">
              <tbody id="multiBody"></tbody>
            </table>
          </div>
        </div>

        <div class="history-box">
          <div class="history-header">
            <span class="history-label">RECENT</span>
            <button class="clear-btn" id="clearHistBtn" hidden>CLEAR</button>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </div>
      </div>

      <footer>
        <span>POWERED BY EXCHANGERATE-API</span>
        <span id="statusDot" class="dot dot--green"></span>
        <span id="statusText">LIVE</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
